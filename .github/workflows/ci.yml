name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MedAdvice.sln

      - name: Build
        run: dotnet build MedAdvice.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MedAdvice.sln --configuration Release --no-build --verbosity normal
